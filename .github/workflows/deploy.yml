name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SERVER: ${{ secrets.SERVER_HOST != '' }}
    steps:
      - name: Skip (server secrets not set yet)
        if: env.HAS_SERVER != 'true'
        run: echo "SERVER_HOST / SERVER_USER / SERVER_SSH_KEY secrets are not configured; skipping deploy."

      - name: Deploy over SSH
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 20m
          script: cd /opt/mycoffee && ./deploy.sh
